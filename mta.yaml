_schema-version: "3.2"
ID: com.amt.golivetracker
version: 0.0.1
description: GoLive Tracker on SAP BTP Cloud Foundry (standalone approuter)

parameters:
  enable-parallel-deployments: true

# The app is built by the UI5 tooling into the approuter, which serves it.
# Needs the dev dependencies installed first (npm install).
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx ui5 build --config=ui5.yaml --clean-dest --dest deploy/approuter/webapp

modules:
  # SAP login (XSUAA), serves the app, and sends /project and /admin to the
  # API (docs/backend-api-guide.md, "Arquitetura e login"). Deployed in the
  # DevOps space, while the API lives in Sandbox: the app cannot bind the
  # API's XSUAA from here, so it has its own, and the destination swaps the
  # user's token for one of the API's XSUAA (OAuth2UserTokenExchange).
  - name: golive-tracker-approuter
    type: approuter.nodejs
    path: deploy/approuter
    parameters:
      host: h2h-sandbox-lwsjexg2-golive-tracker
      memory: 256M
      disk-quota: 512M
    build-parameters:
      ignore: ["node_modules/"]
    requires:
      - name: golive-tracker-uaa
      - name: golive-tracker-destination

resources:
  - name: golive-tracker-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: golive-tracker-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.${default-domain}/**

  # >>> THE API'S CREDENTIALS <<<
  # The destination is created here with no credentials, and the policy
  # "ignore" keeps whatever is set on it later. To let the app call the API,
  # set it, once, to (BTP cockpit > DevOps > Instances > golive-tracker-destination
  # > Destinations > golive-tracker-api):
  #   Authentication: OAuth2UserTokenExchange
  #   Client ID / Client Secret: clientid / clientsecret of a service key
  #     of golive-tracker-api-auth (Sandbox space)
  #   Token Service URL: <url of that key>/oauth/token
  # and drop forwardAuthToken (the exchanged token goes in its place).
  # Secrets stay out of git.
  - name: golive-tracker-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            existing_destinations_policy: ignore
            destinations:
              - Name: golive-tracker-api
                Type: HTTP
                URL: https://amt---consulting--s-a--h2h-sandbox-lwsjexg2-sandbox-gol62961c38.cfapps.us10.hana.ondemand.com
                ProxyType: Internet
                Authentication: NoAuthentication
                forwardAuthToken: true
