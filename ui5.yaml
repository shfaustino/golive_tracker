# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.amt.golivetracker
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.120.49
        backend:
          # The GoLive Tracker API (CAP) running locally: `npm run watch` in
          # golive-tracker-api. It answers 401 with Basic Auth, so the browser
          # asks for a test user (admin/admin, pm/pm, user/user, ...).
          # On BTP the approuter (deploy/approuter) does this job instead.
          - path: /project
            url: http://localhost:4004
          - path: /admin
            url: http://localhost:4004
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
