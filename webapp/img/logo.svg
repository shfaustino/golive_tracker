<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" fill="none">
  <title>GoLive Tracker logo</title>
  <desc>Vector logo with blue tracking/check icon and GoLive Tracker wordmark.</desc>
  <defs>
    <linearGradient id="blueGrad" x1="80" y1="120" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F80FF"/>
      <stop offset="0.55" stop-color="#1463F3"/>
      <stop offset="1" stop-color="#0B43C7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="190" y1="250" x2="390" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F80FF"/>
      <stop offset="1" stop-color="#1463F3"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g aria-label="GoLive Tracker icon">
    <!-- Open circular G/C form -->
    <path d="M286 126
             A128 128 0 1 0 286 374"
          stroke="url(#blueGrad)"
          stroke-width="54"
          stroke-linecap="butt"/>

    <!-- Inner check -->
    <path d="M170 252 L203 285 L262 220"
          stroke="#1F74F7"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Tracking line -->
    <path d="M246 250 H356"
          stroke="url(#lineGrad)"
          stroke-width="18"
          stroke-linecap="round"/>

    <!-- Endpoint -->
    <circle cx="382" cy="250" r="24" fill="#2A73F2"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
     font-size="118" font-weight="800" letter-spacing="-4">
    <text x="450" y="292" fill="#1765F2">GoLive</text>
    <text x="845" y="292" fill="#071B55">Tracker</text>
  </g>
</svg>
